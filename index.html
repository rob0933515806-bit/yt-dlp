<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 下載器</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .format-options {
            display: flex;
            gap: 16px;
        }

        .format-label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: normal;
        }

        .format-label input {
            margin-right: 8px;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .status.loading {
            display: block;
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--primary);
        }

        .status.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .status.success {
            display: block;
            background-color: rgba(34, 197, 94, 0.1);
            color: #22c55e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube 影音下載</h1>
    <p class="subtitle">支援下載 MP4 影片與 MP3 音訊格式</p>

    <div class="form-group">
        <label for="videoUrl">YouTube 連結</label>
        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
    </div>

    <div class="form-group">
        <label>下載格式</label>
        <div class="format-options">
            <label class="format-label">
                <input type="radio" name="format" value="mp4" checked> MP4 (影片)
            </label>
            <label class="format-label">
                <input type="radio" name="format" value="mp3"> MP3 (音樂)
            </label>
        </div>
    </div>

    <button id="downloadBtn" onclick="handleDownload()">開始下載</button>

    <div id="status" class="status"></div>
</div>

<script>
    async function handleDownload() {
        const urlInput = document.getElementById("videoUrl");
        const formatInput = document.querySelector('input[name="format"]:checked');
        const btn = document.getElementById("downloadBtn");
        const statusBox = document.getElementById("status");

        const url = urlInput.value.trim();
        if (!url) {
            showStatus("請輸入有效的 YouTube 網址", "error");
            return;
        }

        // 鎖定介面並提示使用者
        btn.disabled = true;
        showStatus("正在下載與處理影音串流，這可能需要數十秒...", "loading");

        try {
            const response = await fetch("http://localhost:8000/download", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    url: url,
                    format: formatInput.value
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({ detail: "處理失敗" }));
                throw new Error(errData.detail || "無法處理該影片");
            }

            // 解析 Content-Disposition 取得檔名
            let filename = `download.${formatInput.value}`;
            const disposition = response.headers.get("Content-Disposition");
            if (disposition && disposition.includes("filename=")) {
                const filenameMatch = disposition.match(/filename\*?=(?:UTF-8'')?["']?([^"';]+)["']?/i);
                if (filenameMatch && filenameMatch[1]) {
                    filename = decodeURIComponent(filenameMatch[1]);
                }
            }

            // 轉成 Blob 並觸發瀏覽器下載
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

            showStatus("下載完成！", "success");
        } catch (err) {
            showStatus(err.message, "error");
        } finally {
            btn.disabled = false;
        }
    }

    function showStatus(text, type) {
        const statusBox = document.getElementById("status");
        statusBox.textContent = text;
        statusBox.className = `status ${type}`;
    }
</script>

</body>
</html>
