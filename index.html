<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 影音轉換工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ff0000;
        }

        p.subtitle {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #121212;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #ff0000;
        }

        button.btn-parse {
            padding: 12px 24px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-parse:hover {
            background-color: #cc0000;
        }

        .result-card {
            display: none;
            background-color: #121212;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: left;
        }

        .thumbnail-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #000;
        }

        .thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .download-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .download-actions a {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .btn-mp3 {
            background-color: #2ba640;
            color: white;
        }

        .btn-mp4 {
            background-color: #065fd4;
            color: white;
        }

        .download-actions a:hover {
            opacity: 0.9;
        }

        .error-message {
            color: #ff4e4e;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube 轉換器</h1>
    <p class="subtitle">輸入 YouTube 影片連結以解析並選擇轉換格式</p>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="貼上網址 (例: https://www.youtube.com/watch?v=...)" />
        <button class="btn-parse" onclick="parseVideo()">解析</button>
    </div>

    <div id="errorMsg" class="error-message">請輸入有效的 YouTube 影片網址！</div>

    <!-- 影片結果區塊 -->
    <div id="resultCard" class="result-card">
        <div class="thumbnail-wrapper">
            <img id="thumbImg" src="" alt="影片縮圖">
        </div>
        <p id="videoInfo" style="font-size: 13px; color: #aaa; margin-bottom: 10px;"></p>
        
        <div class="download-actions">
            <!-- 示範跳轉至第三方快速解析服務 -->
            <a id="btnMp3" href="#" target="_blank" class="btn-mp3">下載 MP3 音訊</a>
            <a id="btnMp4" href="#" target="_blank" class="btn-mp4">下載 MP4 影片</a>
        </div>
    </div>

    <div class="footer-note">
        ※ 僅供個人學習與測試使用，請遵守 YouTube 服務條款與版權規範。
    </div>
</div>

<script>
    // 從各種 YouTube 網址格式中提取 Video ID
    function extractVideoID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function parseVideo() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const thumbImg = document.getElementById('thumbImg');
        const videoInfo = document.getElementById('videoInfo');
        const btnMp3 = document.getElementById('btnMp3');
        const btnMp4 = document.getElementById('btnMp4');

        const videoId = extractVideoID(urlInput);

        if (!videoId) {
            errorMsg.style.display = 'block';
            resultCard.style.display = 'none';
            return;
        }

        errorMsg.style.display = 'none';

        // 取得 YouTube 封面縮圖
        thumbImg.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
        videoInfo.textContent = `影片 ID: ${videoId}`;

        // 串接外部常見轉換捷徑（例如跳轉至 y2mate 類似的下載網頁）
        // 若你有自己的後端 API，可替換成你的後端端點：/api/convert?id=${videoId}&format=mp3
        btnMp3.href = `https://www.y2mate.com/youtube/${videoId}`;
        btnMp4.href = `https://www.y2mate.com/youtube/${videoId}`;

        resultCard.style.display = 'block';
    }
</script>

</body>
</html>
